# Named zz- so it loads after Debian's security.conf (conf-enabled is read in
# alphabetical order and the last ServerTokens wins).
# Diagnostic page at /info, not linked from anywhere.
# The script lives outside the docroot, so it is not reachable as /info.php
# and /info does not trigger Apache's directory-slash redirect (which would
# build an http:// URL behind the proxy).
Alias /info /var/www/private/info.php
<Directory /var/www/private>
    Require all granted
</Directory>

ServerTokens Prod
ServerSignature Off

# Access log that records the TCP peer (%h, the proxy) and the real client
# (X-Forwarded-For). Same line you would deploy on the real backends.
LogFormat "%h %{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined_xff
LogFormat "%v:%p %h %{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined_xff

# Own :80 vhost so it can set CustomLog. conf-enabled is read before
# sites-enabled, so this becomes the default :80 vhost and the image's
# 000-default.conf is never used.
<VirtualHost *:80>
    ServerName apollo-flux.knet.ca
    DocumentRoot /var/www/html
    CustomLog ${APACHE_LOG_DIR}/access.log vhost_combined_xff
</VirtualHost>
