# Self-signed TLS listener, for testing the proxy -> backend re-encrypt path.
# The php:apache image does not enable mod_ssl, so load it here. The zz- prefix
# keeps it after the image's own config.
# Needs web/tls/flux.crt and flux.key (run ./make-cert.sh first); Apache will
# not start without them. Uses the combined_xff LogFormat from zz-flux.conf.
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
LoadModule ssl_module           /usr/lib/apache2/modules/mod_ssl.so

Listen 443

SSLSessionCache "shmcb:${APACHE_RUN_DIR}/ssl_scache(512000)"
SSLProtocol -all +TLSv1.2 +TLSv1.3

<VirtualHost *:443>
    ServerName apollo-flux.knet.ca
    DocumentRoot /var/www/html
    CustomLog ${APACHE_LOG_DIR}/access.log vhost_combined_xff
    SSLEngine on
    SSLCertificateFile    /etc/ssl/flux/flux.crt
    SSLCertificateKeyFile /etc/ssl/flux/flux.key
</VirtualHost>
